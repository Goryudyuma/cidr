name: Security checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180
      - name: Install verified OSV Scanner
        # SHA256 from the v2.5.1 release's osv-scanner_SHA256SUMS.
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          printf '%s  %s\n' \
            f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be \
            "$RUNNER_TEMP/osv-scanner" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan all locked npm and Go dependencies
        # OSV v2 reads Go dependencies and the standard library from go.mod.
        # Full scans also catch newly disclosed issues in unchanged dependencies.
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile=go.mod --lockfile=package-lock.json --all-vulns --format=table

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        # SHA256 from the v8.30.1 release's gitleaks_8.30.1_checksums.txt.
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history for secrets with redacted output
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color \
            --log-opts='--all' --timeout=120 .
