name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cidr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Lint TypeScript and JavaScript
        run: npm run lint
      - name: Check JSON and YAML formatting
        run: npm run format:check
      - name: Check Go formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo '::error::Run gofmt on the files listed above.'
            exit 1
          fi
      - name: Check workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Test CI maintenance logic
        run: node --test tests/ci/*.test.mjs
      - name: Test lossless share serialization
        run: npm run test:share

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  test:
    name: Build and runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Run Go tests with race detection
        run: go test -race ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Build the Go API
        run: npm run build:api
      - name: Build Wasm and frontend, and check TypeScript
        run: npm run build
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the actual browser Wasm, HTTP API and UI
        run: npx --no-install playwright test
      - name: Upload tested frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cidr-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  checks:
    # Keep the existing ruleset's required check name stable.
    name: Go, Wasm and browser tests
    needs: [quality, security, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$CHECK_RESULTS"
          jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$CHECK_RESULTS"

  deploy:
    name: Deploy frontend to Cloudflare
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cidr-production
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned npm
        run: npm install --global npm@11.5.1
      - name: Install pinned Wrangler
        run: npm ci
      - name: Download the frontend that passed all tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cidr-web
          path: web/dist/
      # Serialized jobs can start out of order. A rerun must not roll back main.
      - name: Check this is still the latest main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping deployment because main has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy cidr
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the repository Actions secret CLOUDFLARE_API_TOKEN before deploying.'
            exit 1
          fi
          npx --no-install wrangler deploy
      - name: Verify production cache headers and conditional responses
        if: steps.current.outputs.deploy == 'true'
        run: |
          node scripts/check-cache.mjs https://cidr.063.jp/
          node scripts/check-cache.mjs https://cidr.goryudyuma.workers.dev/
